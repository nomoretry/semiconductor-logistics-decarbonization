[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-logistics"
version = "0.1.0"
description = "Reproducible logistics optimization and auditable notice-to-action benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["build>=1.2.2,<2", "setuptools>=77,<85"]

[project.scripts]
semiconductor-logistics = "semiconductor_logistics.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["semiconductor_logistics*", "notice_benchmark*", "notice_facts*", "real_notice_eval*", "decision_benchmark*", "coupled_decision*", "budgeted_decision*", "shared*", "scripts*"]
exclude = ["tests*"]

[tool.setuptools]
include-package-data = false
