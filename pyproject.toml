[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "semiconductor-logistics"
version = "0.1.0"
description = "Reproducible logistics optimization and auditable notice-to-action benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["build>=1.2.2,<2", "setuptools>=77,<85", "ruff>=0.17.1,<0.18", "mypy>=2.4,<2.5"]
planning = ["pulp>=3.3,<4", "highspy>=1.7,<2"]
agent = ["langgraph>=1.2.16,<1.3"]

[project.scripts]
semiconductor-logistics = "semiconductor_logistics.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["semiconductor_logistics*", "notice_benchmark*", "notice_facts*", "real_notice_eval*", "decision_benchmark*", "coupled_decision*", "budgeted_decision*", "query_policy*", "query_ppo*", "query_study*", "query_components*", "rolling_inventory*", "rolling_sensitivity*", "rolling_forecast*", "rolling_distribution*", "rolling_recourse*", "network_planning*", "planning_agent*", "shared*", "scripts*"]
exclude = ["tests*"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
network_planning = ["config.json"]
planning_agent = ["eval_cases.json"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Chinese user-facing text uses full-width punctuation, and it is measured at double width,
# so line length and "ambiguous character" checks would flag correct strings.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Lane index `l` follows the formulation x[k,s,l,t] documented in network_planning/model.py.
"network_planning/*.py" = ["E741"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
strict = true
# Modules join this list once they type-check strictly.
files = ["planning_agent/graph.py"]
